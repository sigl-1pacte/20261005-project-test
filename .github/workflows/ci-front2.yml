name: Node App CI

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string

jobs:
  quality:
    name: Node quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ inputs.app-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint
